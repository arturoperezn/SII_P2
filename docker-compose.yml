services:
  db:
    image: postgres:15-alpine
    container_name: postgres_si1
    environment:
      POSTGRES_USER: alumnodb
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: si1
    ports:
      - "9999:5432" # Mapea el puerto 9999 local al 5432 interno (como requiere el enunciado)
    volumes:
      # Montar los scripts en la carpeta de inicialización en orden alfabético
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./populate.sql:/docker-entrypoint-initdb.d/02_populate.sql
      # Volumen persistente para los datos
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: